<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>JISAN AI SINCE TOOLS</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800;900&family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --cyber-red:#ff1744;--cyber-magenta:#d81b60;
      --cyber-cyan:#00e5ff;--cyber-dark:#05020a;
      --cyber-purple:#4a148c;--gold:#fbbf24;
    }
    *{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
    body{overflow:hidden;background:#000;font-family:'Space Grotesk',sans-serif;color:#fff}

    /* IFRAME */
    iframe.bg{position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:1}

    /* ─── SIGNAL BOX (ডিফল্ট সেন্টার পজিশন) ─── */
    #main-wrapper{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      width:200px;
      z-index:100;
      display:none;
      flex-direction:column;
      align-items:center;
      filter:drop-shadow(0 6px 16px rgba(216,27,96,.5));
      touch-action:none;
      cursor:grab;
    }
    #main-wrapper:active{cursor:grabbing}

    .modal-outer{
      width:100%;
      background:linear-gradient(180deg,#ff1744,#4a148c 60%,#05020a);
      padding:2px;
      clip-path:polygon(
        14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 18px),
        65% calc(100% - 18px),55% 100%,45% 100%,35% calc(100% - 18px),
        0 calc(100% - 18px),0 14px
      );
    }
    .modal-inner{
      background:radial-gradient(circle at top,#1a0b2e,#05020a 80%);
      width:100%;height:100%;
      padding:10px 10px 24px 10px;
      clip-path:polygon(
        13px 1px,calc(100% - 13px) 1px,calc(100% - 1px) 13px,
        calc(100% - 1px) calc(100% - 19px),65% calc(100% - 19px),
        55% calc(100% - 1px),45% calc(100% - 1px),35% calc(100% - 19px),
        1px calc(100% - 19px),1px 13px
      );
      display:flex;flex-direction:column;
    }

    /* HEADER */
    .header{display:flex;justify-content:space-between;align-items:center;width:100%}
    .title-text{font-family:'Orbitron',sans-serif;font-weight:900;font-size:11px;color:#fff;letter-spacing:.5px;text-shadow:0 0 6px rgba(255,255,255,.4)}
    .actv-badge{background:linear-gradient(45deg,#4a148c,#7b1fa2);border:1px solid #ab47bc;color:#fff;padding:2px 5px;font-size:7px;font-family:'Orbitron',sans-serif;font-weight:800;border-radius:3px;box-shadow:0 0 6px rgba(171,71,188,.6);letter-spacing:.5px}

    /* CLOSE BTN */
    .close-x{
      width:18px;height:18px;border-radius:3px;cursor:pointer;
      background:rgba(255,23,68,.15);border:1px solid var(--cyber-red);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;transition:.15s;
    }
    .close-x:active{background:rgba(255,23,68,.35);transform:scale(.9)}

    /* SCREEN */
    .screen-container{
      background-color:#03060a;
      background-image:
        linear-gradient(rgba(0,229,255,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,229,255,.08) 1px,transparent 1px);
      background-size:10px 10px;
      border:1px solid var(--cyber-magenta);border-radius:4px;
      padding:8px 6px;position:relative;
      box-shadow:inset 0 0 16px rgba(0,0,0,.9),0 0 8px rgba(216,27,96,.3);
      margin-top:8px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;min-height:70px;
      animation:gridPan 3s linear infinite;
    }
    .screen-top-dashes{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
    .dash{width:16px;height:2px;background:#fff;box-shadow:0 0 4px #fff;border-radius:2px}
    .result-box{
      border:1px solid var(--cyber-cyan);background:rgba(0,229,255,.05);
      padding:6px 10px;text-align:center;border-radius:4px;
      box-shadow:inset 0 0 8px rgba(0,229,255,.2),0 0 6px rgba(0,229,255,.2);
      width:95%;animation:pulseBox 2s ease-in-out infinite;
    }
    .result-big{color:#fff;font-size:15px;font-family:'Orbitron',sans-serif;font-weight:900;text-shadow:0 0 6px rgba(255,255,255,.6);letter-spacing:1px}
    .result-small{color:var(--cyber-cyan);font-size:7px;font-family:'Space Grotesk',sans-serif;font-weight:900;letter-spacing:1px;margin-top:2px;text-shadow:0 0 5px rgba(0,229,255,.8)}

    /* INFO ROW */
    .info-row{display:flex;justify-content:space-between;margin-top:6px;gap:4px}
    .info-box{flex:1;background:rgba(15,5,25,.9);border:1px solid rgba(216,27,96,.4);border-radius:3px;padding:3px 0;text-align:center;box-shadow:inset 0 0 6px rgba(0,0,0,.8)}
    .info-label{color:var(--cyber-magenta);font-size:7px;font-family:'Space Grotesk',sans-serif;font-weight:900;letter-spacing:.5px}
    .info-value{color:var(--cyber-cyan);font-size:8px;font-family:'Orbitron',sans-serif;font-weight:900;margin-top:1px;text-shadow:0 0 4px rgba(0,229,255,.6)}

    /* BTN ROW */
    .btn-row{display:flex;justify-content:space-between;margin-top:8px;gap:6px}
    .btn{
      flex:1;padding:6px 0;border:none;color:#fff;
      font-family:'Orbitron',sans-serif;font-weight:900;font-size:9px;
      letter-spacing:.5px;cursor:pointer;transition:transform .1s;
      text-shadow:0 0 4px rgba(255,255,255,.4);
      clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    }
    .btn:active{transform:scale(.95)}
    .btn-analyze{background:linear-gradient(90deg,#b71c1c,#d81b60);border:1px solid #ff1744;box-shadow:inset 0 0 6px rgba(255,255,255,.2)}
    .btn-hide{background:linear-gradient(90deg,#37474f,#1c262b);border:1px solid #546e7a;box-shadow:inset 0 0 6px rgba(255,255,255,.1);color:#cfd8dc}

    /* PASSWORD INPUT */
    #pass-input{
      width:100%;padding:6px;border-radius:3px;
      border:1px solid var(--cyber-magenta);background:rgba(0,0,0,.6);
      color:#fff;text-align:center;font-family:'Orbitron',sans-serif;
      font-size:10px;outline:none;box-shadow:0 0 6px rgba(216,27,96,.3);
      margin-top:6px;letter-spacing:1px;
    }
    #pass-input:focus{border-color:var(--cyber-cyan);box-shadow:0 0 10px rgba(0,229,255,.5)}
    #pass-input::placeholder{color:#666;letter-spacing:.5px;font-size:8px}

    /* WATERMARK */
    .club-link{
      text-align:center;font-size:7px;color:var(--gold);text-decoration:none;
      font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.5px;
      text-shadow:0 0 4px rgba(240,184,74,.6);margin-top:6px;display:block;
    }

    /* ─── MINI ORB (ডিফল্ট সেন্টার পজিশন) ─── */
    #mini{
      width:46px;height:46px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      cursor:pointer;z-index:15;
      background:radial-gradient(circle at 30% 28%,#d81b60 0%,#4a148c 45%,#05020a 100%);
      box-shadow:0 0 0 1px rgba(255,255,255,.28),0 6px 18px rgba(216,27,96,.5),inset 0 2px 4px rgba(255,255,255,.5);
      animation:floatY 3.2s ease-in-out infinite;
      touch-action:none;
    }
    #mini::after{
      content:'';position:absolute;inset:-6px;border-radius:50%;
      border:2px solid #00e5ff;opacity:.55;
      animation:pulseRing 1.6s ease-out infinite;pointer-events:none;
    }
    #mini img{width:60%;height:60%;object-fit:cover;border-radius:50%;position:relative;z-index:4}

    /* ANIMATIONS */
    @keyframes gridPan{0%{background-position:0 0}100%{background-position:10px 10px}}
    @keyframes floatY{0%,100%{transform:translate(-50%, -50%) translateY(0)}50%{transform:translate(-50%, -50%) translateY(-6px)}}
    @keyframes pulseRing{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.35);opacity:0}}
    @keyframes pulseBox{0%,100%{box-shadow:inset 0 0 8px rgba(0,229,255,.2),0 0 6px rgba(0,229,255,.2)}50%{box-shadow:inset 0 0 16px rgba(0,229,255,.4),0 0 12px rgba(0,229,255,.4)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  </style>
</head>
